  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #FAFCFC; --ink: #0C1413; --ink-soft: #3D4D4A; --teal: #00D1C1; --teal-deep: #0B7E74; --teal-ink: #04302B; --rule-soft: #DCE5E3; }
    body { font-family: 'Hanken Grotesk', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.65; min-height: 100svh; display: grid; place-items: center; padding: 32px; text-align: center; }
    .field { position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(circle, rgba(12,20,19,0.10) 1px, transparent 1px); background-size: 30px 30px; mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 78%); -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 78%); }

    p { color: var(--ink-soft); max-width: 44ch; margin: 0 auto 34px; }

    a.btn:hover { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
    :focus-visible { outline: 3px solid var(--teal-deep); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
  </style>
